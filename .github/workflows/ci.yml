name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      OPENWEATHER_API_KEY: ci_test_key_not_used_in_unit_tests
      DB_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: python -m flake8 src api tests config main.py

      - name: Format check (black)
        run: python -m black --check src api tests config main.py

      - name: Unit tests with coverage
        run: |
          python -m pytest tests/ --ignore=tests/integration \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=70

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-test

    env:
      OPENWEATHER_API_KEY: ci_test_key_not_used_in_unit_tests
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: weather_analytics
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weather_analytics

    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name ci-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=weather_analytics \
            -p 5432:5432 \
            postgres:15
          for i in $(seq 1 60); do
            if docker exec ci-postgres pg_isready -U postgres; then
              echo "PostgreSQL ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL failed to start"
          docker logs ci-postgres
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply database schema
        run: python scripts/ci_apply_schema.py

      - name: Integration tests
        run: python -m pytest tests/integration -m integration -v

      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f ci-postgres
